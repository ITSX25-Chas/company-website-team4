apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: verify-company-website
spec:
  mode: enforce
  images:
  - glob: ghcr.io/jonity-itsx/company-website**
  - glob: ghcr.io/itsx25-chas/company-website-team4**
  authorities:
  - name: deploy-workflow
    keyless:
      identities:
      - issuer: https://token.actions.githubusercontent.com
        subjectRegExp: ^https://github\.com/(jonity-itsx/company-website|(?i:itsx25-chas)/company-website-team4)/\.github/workflows/deploy\.yml@.*$
